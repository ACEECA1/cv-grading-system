spring.application.name=pfe
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pfe_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.email.use-smtp=${USE_SMTP:true}

app.mailersend.api-key=${MAILERSEND_API_KEY:}
app.mailersend.sender-email=${MAILERSEND_SENDER_EMAIL:something@example.com}
app.mailersend.sender-name=${MAILERSEND_SENDER_NAME:CV Grading System}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Make TLS/SSL dynamic so Render doesn't crash if you switch ports
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${EMAIL_SSL:false}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRY_MS:9000000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
app.verification-code-expiry-minutes=${VERIFICATION_CODE_EXPIRY_MINUTES:15}
app.callback.api-key=${X_API_KEY}
app.ocr.url=${OCR_URL:https://ai.api.nvidia.com/v1/cv/nvidia/nemotron-ocr-v1}
app.ocr.api-key=${NVIDIA_API_KEY}
app.n8n.structured-jd-url=${N8N_STRUCTURED_JD_URL}
app.n8n.evaluation-url=${N8N_EVALUATION_URL}
app.automation.use-n8n=${USE_N8N:true}
app.openrouter.api-key=${OPENROUTER_API_KEY}
app.openrouter.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
app.openrouter.model=${OPENROUTER_MODEL:qwen/qwen3.5-35b-a3b}
app.openrouter.system-prompt=${STRUCTURED_JD_SYSTEM_PROMPT:You are an AI assistant.}
app.openrouter.repair-system-prompt=${REPAIR_SYSTEM_PROMPT:You are a JSON fixer.}
app.openrouter.log-payloads=${OPENROUTER_LOG_PAYLOADS:false}
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.company-name=${COMPANY_NAME:}
app.frontend-urls=${FRONTEND_URLS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.100.3:5173,https://cv-grading-system-frontend.vercel.app}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.first-name=${ADMIN_FIRST_NAME:System}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@local.test}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}

# Full Backend Logging Control
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.djezzy.pfe=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_HIBERNATE_BINDER:TRACE}
logging.level.org.djezzy.pfe.service.workflow=${LOGGING_LEVEL_WORKFLOW:INFO}
